server:
  port: 8080

spring:
  application:
    name: interview-prep-platform

  datasource:
    url: jdbc:h2:mem:interviewprep;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  ai:
    openrouter:
     openrouter:
     api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: openrouter/free

app:
  jwt:
    secret: "replace-this-with-a-long-random-secret-key-min-32-chars-please-change-me"
    expiration-ms: 86400000

  cors:
    allowed-origins: "http://localhost:5173"